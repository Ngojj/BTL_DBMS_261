services:
  postgres:
    image: postgres:16
    container_name: ticketrush-postgres
    environment:
      POSTGRES_USER: ticketrush
      POSTGRES_PASSWORD: ticketrush
      POSTGRES_DB: ticketrush
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Chỉ chạy khi volume còn trống (lần khởi tạo đầu). Nạp lại: docker compose down -v
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketrush -d ticketrush"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
